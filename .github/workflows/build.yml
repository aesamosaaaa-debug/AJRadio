name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Write project files
        run: |
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_FILE_0'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.ajradio"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.ajradio"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.3.1")
              implementation("androidx.media3:media3-session:1.3.1")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("com.google.guava:guava:33.2.1-android")
          }
          EOF_FILE_0
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="راديو الانترنت"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
                  <receiver android:name=".ActionReceiver" android:exported="false" />
                  <receiver android:name=".RadioWidget" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF_FILE_1
          mkdir -p $(dirname app/src/main/java/com/example/ajradio/Cfg.kt)
          cat > app/src/main/java/com/example/ajradio/Cfg.kt <<'EOF_FILE_2'
          package com.example.ajradio

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.Calendar

          object Cfg {
              const val DEF_URL = "https://live-hls-audio-web-aja.getaj.net/VOICE-AJA/01.m3u8"
              const val DEF_NAME = "الجزيرة"
              val sec = intArrayOf(10, 30, 90)
              val off = longArrayOf(6000, 20000, 45000)

              fun live(idx: Int) = MediaItem.LiveConfiguration.Builder().setTargetOffsetMs(off[idx]).build()

              fun item(url: String, name: String, idx: Int): MediaItem = MediaItem.Builder()
                  .setUri(url)
                  .setMediaMetadata(MediaMetadata.Builder().setTitle(name).setArtist("راديو الانترنت").build())
                  .setLiveConfiguration(live(idx))
                  .build()

              fun saved(c: Context): MediaItem {
                  val p = c.getSharedPreferences("aj", 0)
                  return item(p.getString("sel", DEF_URL)!!, p.getString("selName", DEF_NAME)!!, p.getInt("buf", 1))
              }

              fun op(c: Context, action: String, code: Int): PendingIntent = PendingIntent.getBroadcast(
                  c, code, Intent(c, ActionReceiver::class.java).setAction(action),
                  PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
              )

              fun setAlarm(c: Context) {
                  val p = c.getSharedPreferences("aj", 0)
                  val cal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, p.getInt("alH", 7)); set(Calendar.MINUTE, p.getInt("alM", 0))
                      set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                      if (timeInMillis <= System.currentTimeMillis() + 1000) add(Calendar.DAY_OF_YEAR, 1)
                  }
                  val show = PendingIntent.getActivity(c, 1, Intent(c, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  c.getSystemService(AlarmManager::class.java)
                      .setAlarmClock(AlarmManager.AlarmClockInfo(cal.timeInMillis, show), op(c, "aj.ALARM", 2))
              }

              fun cancelAlarm(c: Context) {
                  c.getSystemService(AlarmManager::class.java).cancel(op(c, "aj.ALARM", 2))
              }

              fun search(q: String): List<Pair<String, String>> {
                  for (h in listOf("de1", "nl1", "fi1")) {
                      try {
                          val u = URL("https://${h}.api.radio-browser.info/json/stations/search?limit=30&hidebroken=true&order=clickcount&reverse=true&name=" + URLEncoder.encode(q, "UTF-8"))
                          val con = u.openConnection() as HttpURLConnection
                          con.setRequestProperty("User-Agent", "InternetRadio/2.0")
                          con.connectTimeout = 8000; con.readTimeout = 8000
                          val a = JSONArray(con.inputStream.bufferedReader().readText())
                          return (0 until a.length()).map {
                              val o = a.getJSONObject(it)
                              val cc = o.optString("countrycode")
                              Pair(o.optString("name").trim() + (if (cc.isEmpty()) "" else " ($cc)"), o.optString("url_resolved"))
                          }.filter { it.second.startsWith("http") }
                      } catch (e: Exception) { }
                  }
                  return emptyList()
              }
          }
          EOF_FILE_2
          mkdir -p $(dirname app/src/main/java/com/example/ajradio/Extras.kt)
          cat > app/src/main/java/com/example/ajradio/Extras.kt <<'EOF_FILE_3'
          package com.example.ajradio

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import androidx.core.content.ContextCompat
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken

          class ActionReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val pr = goAsync()
                  val action = i.action
                  if (action == "aj.ALARM" && c.getSharedPreferences("aj", 0).getBoolean("alOn", false)) Cfg.setAlarm(c)
                  val f = MediaController.Builder(c, SessionToken(c, ComponentName(c, PlaybackService::class.java))).buildAsync()
                  f.addListener({
                      try {
                          val m = f.get()
                          if (action == "aj.TOGGLE" && m.playWhenReady) m.pause()
                          else { m.setMediaItem(Cfg.saved(c)); m.prepare(); m.play() }
                      } catch (e: Exception) { }
                      pr.finish()
                  }, ContextCompat.getMainExecutor(c))
              }
          }

          class RadioWidget : AppWidgetProvider() {
              override fun onUpdate(c: Context, m: AppWidgetManager, ids: IntArray) {
                  val v = RemoteViews(c.packageName, R.layout.widget)
                  v.setOnClickPendingIntent(R.id.wroot, Cfg.op(c, "aj.TOGGLE", 3))
                  ids.forEach { m.updateAppWidget(it, v) }
              }
          }
          EOF_FILE_3
          mkdir -p $(dirname app/src/main/java/com/example/ajradio/MainActivity.kt)
          cat > app/src/main/java/com/example/ajradio/MainActivity.kt <<'EOF_FILE_4'
          package com.example.ajradio

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.app.TimePickerDialog
          import android.content.ComponentName
          import android.content.SharedPreferences
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.*
          import androidx.core.content.ContextCompat
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionCommand
          import androidx.media3.session.SessionToken
          import com.google.common.util.concurrent.ListenableFuture
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          private val BG = 0xFF0B1F23.toInt()
          private val CARD = 0xFF12333A.toInt()
          private val CHIP = 0xFF1B454D.toInt()
          private val GOLD = 0xFFE3B866.toInt()
          private val TXT = 0xFFF1EADB.toInt()
          private val MUTE = 0xFF8FA9A6.toInt()

          class MainActivity : Activity() {
              data class St(val name: String, val url: String, var fav: Boolean)

              private val all = mutableListOf<St>()
              private var vis = listOf<St>()
              private var ctl: MediaController? = null
              private var fut: ListenableFuture<MediaController>? = null
              private var err: String? = null
              private var sleepPos = 0
              private lateinit var prefs: SharedPreferences
              private lateinit var status: TextView
              private lateinit var nowName: TextView
              private lateinit var sleepInfo: TextView
              private lateinit var alTime: TextView
              private lateinit var play: TextView
              private lateinit var spin: Spinner
              private lateinit var favOnly: CheckBox

              private val sleepMin = intArrayOf(0, 15, 30, 45, 60, 120, 180, 240, 300, 360, 480, 600, 720)
              private val sleepLbl = listOf(
                  "بدون", "15 دقيقة", "30 دقيقة", "45 دقيقة", "ساعة", "ساعتان", "3 ساعات",
                  "4 ساعات", "5 ساعات", "6 ساعات", "8 ساعات", "10 ساعات", "12 ساعة"
              )
              private val bufLbl = listOf("صغير (استجابة أسرع)", "متوسط", "كبير (أقل تقطيعًا)")

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()
              private fun rr(c: Int, r: Int) = GradientDrawable().apply { setColor(c); cornerRadius = dp(r).toFloat() }
              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
              private fun timeStr() = "%02d:%02d".format(prefs.getInt("alH", 7), prefs.getInt("alM", 0))

              private fun Spinner.items(l: List<String>) {
                  adapter = ArrayAdapter(context, android.R.layout.simple_spinner_item, l).also {
                      it.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                  }
              }

              private fun Spinner.onSel(f: (Int) -> Unit) {
                  onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: View?, i: Int, id: Long) = f(i)
                      override fun onNothingSelected(p: AdapterView<*>?) {}
                  }
              }

              private fun load() {
                  all.clear()
                  val raw = prefs.getString("st", null) ?: "${Cfg.DEF_NAME}\t${Cfg.DEF_URL}\t0"
                  raw.split("\n").forEach {
                      val p = it.split("\t")
                      if (p.size >= 3) all.add(St(p[0], p[1], p[2] == "1"))
                  }
              }

              private fun save() {
                  prefs.edit().putString("st", all.joinToString("\n") { "${it.name}\t${it.url}\t${if (it.fav) 1 else 0}" }).apply()
              }

              private fun pick(s: St) { prefs.edit().putString("sel", s.url).putString("selName", s.name).apply() }

              private fun refresh() {
                  val sel = prefs.getString("sel", "")
                  vis = all.filter { !favOnly.isChecked || it.fav }
                  spin.items(vis.map { (if (it.fav) "★ " else "") + it.name })
                  val i = vis.indexOfFirst { it.url == sel }
                  if (i >= 0) spin.setSelection(i)
              }

              private fun cur(): St? = vis.getOrNull(spin.selectedItemPosition)

              private fun playSelected() {
                  val c = ctl ?: return
                  val s = cur() ?: return
                  err = null
                  c.setMediaItem(Cfg.item(s.url, s.name, prefs.getInt("buf", 1)))
                  c.prepare()
                  c.play()
              }

              private fun toggle() {
                  val c = ctl ?: return
                  val s = cur() ?: return
                  if (c.playWhenReady && c.playbackState != Player.STATE_IDLE) {
                      c.pause()
                  } else if (c.currentMediaItem?.localConfiguration?.uri?.toString() == s.url &&
                      c.playbackState != Player.STATE_IDLE
                  ) {
                      err = null; c.seekToDefaultPosition(); c.play()
                  } else playSelected()
              }

              private fun updateUi() {
                  val c = ctl
                  if (c == null) { status.text = "جارٍ الاتصال بالخدمة…"; return }
                  val on = c.playWhenReady && c.playbackState != Player.STATE_IDLE
                  play.text = if (on) "❚❚" else "▶"
                  status.text = when {
                      on && c.isPlaying -> "يعمل الآن"
                      on -> "جارٍ التحميل…"
                      err != null -> err
                      else -> "متوقف"
                  }
              }

              private fun showSleep() {
                  val end = prefs.getLong("sleepEnd", 0L)
                  sleepInfo.text = if (end > System.currentTimeMillis())
                      "سيتوقف الساعة " + SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date(end)) else ""
              }

              private val lis = object : Player.Listener {
                  override fun onEvents(player: Player, events: Player.Events) = updateUi()
                  override fun onPlayerError(error: PlaybackException) {
                      err = "تعذّر التشغيل: " + error.errorCodeName
                      updateUi()
                  }
              }

              private fun addDialog() {
                  val n = EditText(this).apply { hint = "اسم المحطة" }
                  val u = EditText(this).apply {
                      hint = "رابط البث (.m3u8 أو .mp3)"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                  }
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(8), dp(20), 0)
                      addView(n); addView(u)
                  }
                  AlertDialog.Builder(this).setTitle("إضافة محطة").setView(box)
                      .setPositiveButton("إضافة") { _, _ ->
                          val url = u.text.toString().trim()
                          val name = n.text.toString().trim().ifEmpty { "محطة" }.replace(Regex("[\t\n]"), " ")
                          if (url.startsWith("http")) { addStation(name, url) } else toast("الرابط يجب أن يبدأ بـ http")
                      }.setNegativeButton("إلغاء", null).show()
              }

              private fun addStation(name: String, url: String) {
                  val s = St(name.replace(Regex("[\t\n]"), " "), url, false)
                  all.add(s); save(); pick(s); refresh()
              }

              private fun searchDialog() {
                  val q = EditText(this).apply { hint = "اسم المحطة أو البلد"; imeOptions = EditorInfo.IME_ACTION_SEARCH; setSingleLine() }
                  val res = mutableListOf<Pair<String, String>>()
                  val ad = ArrayAdapter(this, android.R.layout.simple_list_item_1, mutableListOf<String>())
                  val list = ListView(this).apply { adapter = ad }
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), 0)
                      addView(q); addView(list, LinearLayout.LayoutParams(-1, dp(320)))
                  }
                  val dlg = AlertDialog.Builder(this).setTitle("بحث عن محطة").setView(box).setNegativeButton("إغلاق", null).create()
                  q.setOnEditorActionListener { _, _, _ ->
                      val t = q.text.toString().trim()
                      if (t.isNotEmpty()) Thread {
                          val r = Cfg.search(t)
                          runOnUiThread {
                              res.clear(); res.addAll(r); ad.clear(); ad.addAll(r.map { it.first })
                              if (r.isEmpty()) toast("لا نتائج أو لا يوجد اتصال")
                          }
                      }.start()
                      true
                  }
                  list.setOnItemClickListener { _, _, i, _ ->
                      addStation(res[i].first, res[i].second); toast("أُضيفت المحطة"); dlg.dismiss()
                  }
                  dlg.show()
              }

              private fun bu
